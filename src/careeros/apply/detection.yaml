# Bot-detection registry. The apply-job skill appends an entry whenever it hits CAPTCHA, a Cloudflare
# challenge, Turnstile, an unexpected redirect, or a silent form rejection. It reads this file before
# every attempt: a company or domain listed here with `skip_auto: true` goes straight to an Action Item
# ("review & submit", prepared materials attached) instead of an automated run.
#
# detection_type: hcaptcha | recaptcha | turnstile | cloudflare_challenge | verify_human_text |
#                 unexpected_redirect | silent_rejection | rate_limit | account_verify_email | other
# Remove or set skip_auto: false after the candidate confirms the site works again.

entries: []
