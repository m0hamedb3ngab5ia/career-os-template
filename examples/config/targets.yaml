# ==================================================================================================
# config/targets.yaml: WHAT TO APPLY TO, AND HOW AUTONOMOUSLY
#
# What this file is:
#   Job preferences read by scout (prefilter), score-job (fit, tier) and apply-job (caps, safety).
#   The pipeline re-reads it every run. `careeros init` copies it to config/targets.yaml.
#
# What you must fill in (lines with an INSERT comment):
#   - candidate: level, graduation, salary floors, work authorization
#   - location: preferred cities and regions
#   - industries: which to boost, which to block
#
# What you can leave as is (reusable default: fine to keep):
#   - seniority keywords, categories, thresholds, tiers, tier_rules, volume, safety.
#     Tune them later once you see what scout and score-job produce.
# ==================================================================================================

candidate:
  level: new_grad            # INSERT: new_grad | early_career (0-2 yrs); both accepted
  graduation: 2026-05        # INSERT: YYYY-MM of your (expected) graduation, e.g. 2025-12
  current_base_usd: null     # INSERT: optional current base salary in USD, e.g. 85000, or null (informational)
  min_base_usd: 90000        # INSERT: whole USD; skip a posting whose max salary is below this (unknown = allowed), e.g. 100000
  salary_dropdown_floor_usd: 90000   # INSERT: whole USD; when a form offers salary *ranges* in a dropdown, the applier
                                     # picks the lowest bucket whose floor is >= this. Freeform salary = Action Item.
  work_authorization: us_citizen     # INSERT: us_citizen | permanent_resident | visa (e.g. F-1 OPT, H-1B)
  needs_sponsorship: false           # INSERT: true | false

location:
  preferred: [New York NY, Boston MA, San Francisco CA, Seattle WA]   # INSERT: cities as "City ST", e.g. [Austin TX, Chicago IL]
  preferred_regions: [US]            # INSERT: ISO country codes, e.g. [US, CA]
  allowed_countries: [US, "*"]       # "*" = anywhere else allowed...
  blocked_countries: []              # ...except these ISO codes, e.g. [XX, YY]
  remote_ok: true
  # Extra location words per blocked country code (merged over the built-in table in careeros.scout).
  # country_aliases:
  #   DE: [germany, berlin, munich]
  # Non-preferred location still applied to if fit >= thresholds.min_fit_nonpreferred_location.

seniority:                  # reusable default: fine to keep. Title-level prefilter in scout (cheap, before LLM scoring)
  exclude_title_keywords: [senior, sr., staff, principal, lead, manager, director, head of, vp, vice president, distinguished, architect, fellow, intern, internship, co-op, phd, postdoc, chief]
  # "lead" matches "Tech Lead"; "Team Lead" etc. Titles like "Software Engineer II" pass; scorer handles YOE.

categories:                 # reusable default: fine to keep (see categories.yaml for keyword definitions)
  primary: [swe_backend, swe_fullstack, data_engineering, swe_platform]
  secondary: [ml_engineering, swe_mobile, quant_dev, sre_devops]
  excluded: [product_manager, sales_eng, support, qa_manual, hardware]

industries:
  boost: [ai_ml, fintech, developer_tools, infra_cloud]   # INSERT: industries to rank higher, e.g. [healthtech, climate]
  blocked: [gambling]                                     # INSERT: industries never applied to, or []

# reusable default: fine to keep. Fit-score cutoffs used by score-job.
thresholds:
  min_fit_to_prepare: 70     # below → status skipped, reason logged
  min_fit_nonpreferred_location: 85
  boost_industry_bonus: 5    # added to fit for boost industries (doesn't bypass min)
  tier_a_min_fit: 60         # dream firms: prepare even at lower fit, but flag gap

# reusable default: fine to keep. Autonomy per tier (README "Autonomy tiers").
tiers:
  A:
    description: dream firms — full prep, the candidate submits
    auto_submit: false
    cover_letter: always
    outreach: always
    review_required: [resume, cover_letter, answers, form]
  B:
    description: strong fit — auto-submit after QA
    auto_submit: true
    cover_letter: always
    outreach: if_contact_found
    review_required: []      # only QA failures surface
  C:
    description: volume
    auto_submit: true
    cover_letter: if_required
    outreach: never
    review_required: []

tier_rules:                 # reusable default: fine to keep. First match wins; default tier by fit score
  - if: company_in dream_list
    tier: A
  - if: fit >= 85
    tier: B
  - if: fit >= 70
    tier: C

# reusable default: fine to keep. Daily and per-company caps.
volume:
  max_applications_per_day: 15
  max_per_company_per_90_days: 2      # avoid spray flag
  same_company_cooldown_days: 30      # after rejection
  season_multiplier:                  # month → multiplier on max/day
    "9": 2.0
    "10": 1.5
    "1": 2.0
    "2": 1.5

# reusable default: fine to keep. Only change if you understand the applier (src/careeros/apply/adapters.md).
safety:
  # ATS families where auto-submit is allowed. Others → prepare + Action Item.
  auto_submit_ats: [greenhouse, lever, ashby]
  assisted_ats: [workday, icims, taleo, smartrecruiters, jobvite, successfactors, custom]
  pause_on:                            # always Action Item, never auto
    - captcha
    - account_creation_email_verify
    - question_not_in_standard_answers
    - salary_field_freeform
    - bot_detection_suspected
    - file_upload_failed
    - qa_failed_twice
  scam:                                # careeros safety check (src/careeros/safety/scam.py)
    salary_max_multiple: 3             # soft flag when posted salary > this x candidate.min_base_usd
  ghost:                               # ghost-job detection (src/careeros/safety/ghost.py)
    stale_flag_days: 30                # posted this many days ago -> flag (no auto-submit)
    stale_skip_days: 45                # -> skip (dream companies only flagged)
    repost_window_days: 90
    repost_flag_count: 3               # same role reposted this many times in the window -> flag
    layoff_window_days: 180            # freeze in window -> skip; layoffs in window -> flag
