# ==================================================================================================
# config/categories.yaml: JOB CATEGORIES
#
# What this file is:
#   The job families score-job sorts postings into (exactly one each). Each maps to title and skill
#   keywords, a résumé template and the order in which your experience is considered.
#
# What you must fill in (lines with an INSERT comment):
#   - bullet_priority in every category you target: entry ids from YOUR profile/master.yaml
#     (experience / projects), most relevant first. `careeros doctor` FAILs on an id that does not exist.
#
# What you can leave as is (reusable default: fine to keep):
#   - labels, title_keywords, skill_keywords, cover_letter, the excluded categories.
#     Add a category = add a block here (and name it in config/targets.yaml categories). The first
#     3 outputs of a new category are review_required regardless of tier.
# ==================================================================================================

# reusable default: fine to keep (everything except bullet_priority)
swe_backend:
  label: Software Engineer (Backend)
  title_keywords: [software engineer, backend engineer, back-end, server engineer, api engineer, software developer, sde, swe]
  skill_keywords: [python, java, typescript, go, sql, aws, distributed, microservices, rest, grpc, postgres, kafka]
  resume_template: default
  bullet_priority: [acme, initech_intern, widgetizer]   # INSERT: entry ids from your master.yaml, most relevant first, e.g. [northwind, tasklight]
  cover_letter: true
  new_category_reviews_remaining: 0

