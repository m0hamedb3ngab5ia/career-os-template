# Job categories. Scorer assigns exactly one. Each maps to résumé template + bullet priorities.
# Add a category = add a block here. First 3 outputs of any new category are review_required regardless of tier.
# `bullet_priority` lists entry ids from profile/master.yaml (experience/projects), most relevant first. EDIT per candidate.

swe_backend:
  label: Software Engineer (Backend)
  title_keywords: [software engineer, backend engineer, back-end, server engineer, api engineer, software developer, sde, swe]
  skill_keywords: [python, java, typescript, go, sql, aws, distributed, microservices, rest, grpc, postgres, kafka]
  resume_template: default
  bullet_priority: [acme, initech_intern, widgetizer]
  cover_letter: true
  new_category_reviews_remaining: 0

