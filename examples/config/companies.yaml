# Aggregator / discovery sources. Priority order. All feed postings into the same pipeline; apply ALWAYS on company ATS.
# public = no login, parse directly.  chrome = read through the candidate's logged-in Chrome (Claude in Chrome); fragile, discovery only.
searches:
  keywords: [software engineer new grad, software engineer early career, backend engineer, data engineer, platform engineer]   # INSERT: search phrases for your target roles, e.g. [data analyst, analytics engineer]
  sources:             # reusable default: fine to keep
    - {name: simplify_newgrad_github, kind: public, enabled: true,
       url: https://github.com/SimplifyJobs/New-Grad-Positions, notes: "README table → company, role, location, apply link (ATS). Daily."}
    - {name: jobright, kind: chrome, enabled: false,
       url: null, notes: "Optional: paste your saved-search / recommended-jobs URL. Extract the company apply URL; never use Jobright auto-apply."}
    - {name: handshake, kind: chrome, enabled: false,
       url: null, notes: "Optional: paste your school's Handshake job-search URL. Alumni access is often time-limited."}
    - {name: linkedin_jobs, kind: chrome, enabled: false,
       url: null, notes: "Discovery only. Never Easy Apply."}

# reusable default: fine to keep. Prestige tiers (community ranking; edit freely). Used by the scorer:
#   - god/sss/ss/ss_minus/s → default Tier A candidates (still gated by fit; tier_a_min_fit applies)
#   - a_plus/a → Tier B boost (+prestige bonus)
#   - b_plus/b/b_minus → neutral
#   - avoid → skipped unless fit >= 90 and the candidate overrides
# Team/work matter more than letter; this only nudges ordering. Add names freely.
prestige_tiers:        # reusable default: fine to keep
  god:      [Renaissance Technologies, Radix Trading, TGS Management, Arrowstreet Capital, PDT Partners]
  sss:      [Citadel, Citadel Securities, Hudson River Trading, Jump Trading]
  ss:       [Optiver, Two Sigma, D. E. Shaw, Five Rings, Voleon, XTX Markets, Anthropic, OpenAI]
  ss_minus: [IMC, Susquehanna, SIG, DRW, Virtu, Millennium, Tower Research, AQR, Point72]
  s:        [WorldQuant, Akuna Capital, NVIDIA, Netflix, Roblox]
  a_plus:   [Microsoft, Meta, Apple, Google, Stripe, Airbnb, Databricks, Tesla, Uber, DoorDash]
  a:        [Notion, Asana, Reddit, LinkedIn, Spotify, Dropbox, Pinterest, Plaid, Figma, Discord]
  b_plus:   [Amazon, Adobe, Cloudflare, eBay, X, GitHub, HashiCorp, Oracle, Lyft, Twitch, Salesforce]
  b:        [Capital One, JPMorgan, Morgan Stanley, Intel, Booking, BlackRock, IBM]
  b_minus:  [Citi, Wells Fargo, Goldman Sachs, Bank of America, Boeing, Booz Allen, Walmart]
  avoid:    [Accenture, TCS, Deloitte, HCLTech, Cognizant, Infosys, Capgemini, Wipro]

prestige_scoring:      # reusable default: fine to keep
  bonus: {god: 10, sss: 10, ss: 8, ss_minus: 6, s: 5, a_plus: 4, a: 2, b_plus: 0, b: 0, b_minus: -2, avoid: -100}
  auto_dream: [god, sss, ss, ss_minus, s]   # merged into dream_list at runtime
