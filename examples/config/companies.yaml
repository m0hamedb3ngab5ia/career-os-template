  - {company: Bloomberg,        ats: custom,     url: https://bloomberg.avature.net/careers}
  - {company: Snowflake,        ats: custom,     url: https://careers.snowflake.com}
  - {company: Airbnb,           ats: greenhouse, slug: airbnb}
