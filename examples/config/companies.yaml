# ==================================================================================================
# config/companies.yaml: WHICH COMPANIES
#
# What this file is:
#   Company lists. Scout pulls every job board under `boards`; the dream list and blocklist set the
#   tier and filter postings. `careeros init` copies it to config/companies.yaml.
#
# What you must fill in (lines with an INSERT comment):
#   - dream_list: companies where you want to review and submit yourself (Tier A)
#   - already_applied: applications you sent before using career-os
#   - blocklist: ALWAYS put your current employer here, plus industries / names to never apply to
#   - searches.keywords: what you search for
#
# What you can leave as is (reusable default: fine to keep):
#   - boards: a starter list of public job boards (add or remove freely)
#   - searches.sources, prestige_tiers, prestige_scoring
#
# ATS board slugs: greenhouse = boards-api.greenhouse.io/v1/boards/<slug>/jobs
#                  lever      = api.lever.co/v0/postings/<slug>
#                  ashby      = api.ashbyhq.com/posting-api/job-board/<slug>
# Add a company = one line. Unknown slug? scout reports it as a 404 "bad slug".
# ==================================================================================================

dream_list:            # INSERT: company names, one per line, e.g. - Figma. Tier A: full prep, you submit, outreach prioritized
  - Stripe
  - Databricks
  - Anthropic

already_applied: []    # INSERT: past applications, e.g. [{company: Acme, role: Software Engineer, date: 2026-07}]; skipped unless 90 days passed

blocklist:             # never apply
  companies: [Globex Bank]                    # INSERT: your current employer (+ any company to never apply to), e.g. [Initrode]
  industries: [gambling]                      # INSERT: industries to never apply to, or []
  name_patterns: [draftkings, fanduel]        # INSERT: lowercase substrings of company names to skip, or []

# Company-owned domains for the scam gate (careeros safety check). Needed only when the careers site's
# domain is not just the company name (acme.com for "Acme" is recognized on its own). Board entries may
# also carry `domain:`. A posting whose apply URL is on neither a known ATS nor one of these is a hard stop.
company_domains: {}    # e.g. {"Two Sigma": twosigma.com, "Example Corp": [example.com, examplecareers.com]}

boards:                # reusable default: fine to keep. Scout sources. ats: greenhouse | lever | ashby | custom (no adapter yet; skipped)
  # --- AI ---
  - {company: Anthropic,        ats: greenhouse, slug: anthropic}
  - {company: OpenAI,           ats: ashby,      slug: openai}
  - {company: Scale AI,         ats: greenhouse, slug: scaleai}
  - {company: Cohere,           ats: ashby,      slug: cohere}
  - {company: Perplexity,       ats: ashby,      slug: perplexity}
  - {company: Hugging Face,     ats: custom,     url: https://apply.workable.com/huggingface/}   # Workable; no adapter yet
  - {company: Mistral AI,       ats: custom,     url: https://jobs.lever.co/mistral}              # lever slug returns empty; verify
  - {company: Cursor,           ats: ashby,      slug: cursor}
  - {company: Runway,           ats: ashby,      slug: runway}
  # --- Quant / HF ---
  - {company: Hudson River Trading, ats: greenhouse, slug: wehrtyou}
  - {company: Two Sigma,        ats: custom,     url: https://careers.twosigma.com/careers/OpenRoles}
  - {company: Jump Trading,     ats: greenhouse, slug: jumptrading}
  - {company: Citadel,          ats: custom,     url: https://www.citadel.com/careers/open-opportunities/}
  - {company: DRW,              ats: greenhouse, slug: drweng}
  - {company: IMC,              ats: greenhouse, slug: imc}
  - {company: Optiver,          ats: greenhouse, slug: optiverus}
  - {company: Point72,          ats: greenhouse, slug: point72}
  - {company: Millennium,       ats: custom,     url: https://www.mlp.com/careers/}
  - {company: Tower Research,   ats: greenhouse, slug: towerresearchcapital}
  - {company: Akuna Capital,    ats: greenhouse, slug: akunacapital}
  - {company: Five Rings,       ats: greenhouse, slug: fiveringsllc}
  # --- Fintech / Infra / Dev tools ---
  - {company: Stripe,           ats: greenhouse, slug: stripe}
  - {company: Databricks,       ats: greenhouse, slug: databricks}
  - {company: Ramp,             ats: ashby,      slug: ramp}
  - {company: Brex,             ats: greenhouse, slug: brex}
  - {company: Plaid,            ats: ashby,      slug: plaid}
  - {company: Vercel,           ats: greenhouse, slug: vercel}
  - {company: Supabase,         ats: ashby,      slug: supabase}
  - {company: Datadog,          ats: greenhouse, slug: datadog}
  - {company: Cloudflare,       ats: greenhouse, slug: cloudflare}
  - {company: Figma,            ats: greenhouse, slug: figma}
  - {company: Notion,           ats: ashby,      slug: notion}
  - {company: Linear,           ats: ashby,      slug: linear}
