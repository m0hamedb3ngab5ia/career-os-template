# ==================================================================================================
# config/pipeline.yaml: PATHS, SCHEDULE, LLM RUNNER
#
# What this file is:
#   Where data lives and when the pipeline runs. Relative paths resolve against the repo root; `~` is expanded.
#
# What you must fill in:
#   - nothing. Optionally point paths.tracker_xlsx somewhere you can open it easily
#     (e.g. ~/Documents/JobTracker.xlsx).
#
# What you can leave as is (reusable default: fine to keep):
#   - the whole file. llm.runner stays claude_code (your Claude Code subscription; no API key).
# ==================================================================================================
# reusable default: fine to keep
paths:
  tracker_xlsx: data/JobTracker.xlsx       # gitignored. Point it anywhere, e.g. ~/Documents/JobTracker.xlsx
  jobs_dir: data/jobs
  seen_file: data/seen.json
  profile: profile/master.yaml
  standard_answers: profile/standard_answers.yaml
  voice_dir: profile/voice
  resume_template_dir: templates/resume
  output_dir_per_job: true                 # data/jobs/<id>/{posting.json,score.json,resume.pdf,cover_letter.md,answers.json,qa.json,log.md}

schedule:                                  # reusable default: fine to keep. `careeros schedule install` adds a macOS
                                           # LaunchAgent that runs `careeros tick` every tick_minutes; the tick runs
                                           # whatever is due below. Follow-ups are not scheduled here.
  tick_minutes: 15                         # 15 (Recommended): how often launchd wakes `careeros tick`
  timezone: local                          # local (Recommended) or an IANA name, e.g. America/New_York
  quiet_hours: {start: "09:00", end: "18:00"}  # (Recommended) claude-using runs (score, prepare) never start
                                           # inside this window; scout and prune ignore it. null = no quiet hours
  missed_after_minutes: 60                 # 60 (Recommended): slots missed while the Mac slept or was off (by more
                                           # than this) never auto-run; they collapse into ONE pending catch-up you
                                           # start with `careeros run catch-up` (or dismiss with --dismiss)
  jobs:                                    # each job: every_hours: N | every_days: N | at: ["HH:MM", ...] (local time)
    scout:   {every_hours: 3}              # 3 (Recommended: 2-3): `careeros scout --sync`; no quiet hours
    inbox_sync:                            # /inbox-sync (Gmail) twice a day. OFF until the inbox-sync skill is finished
      at: ["08:00", "18:00"]               # (Recommended) once enabled
      enabled: false                       # false (Recommended for now)
      mcp_servers: [gmail]                 # must be logged in (run `claude`, /mcp, once): else the run stops auth_required
      allowed_tools_extra: [ToolSearch, mcp__claude_ai_Gmail__search_threads, mcp__claude_ai_Gmail__get_thread]
    score:   {at: ["01:00"]}               # nightly 01:00 (Recommended): `careeros run score` with runs.preset
    prepare: {at: ["02:00"]}               # nightly 02:00 (Recommended): `careeros run prepare`; never applies
    prune:   {every_days: 7}               # 7 = weekly (Recommended): `careeros prune --yes` (retention below)
  launchd_label: com.careeros.tick

llm:                                       # reusable default: fine to keep
  runner: claude_code                      # claude_code (subscription, `claude -p`) | api (NOT enabled; requires explicit opt-in)
  # How `careeros run` calls a skill (the prompt `/score-job data/jobs/<id>` is appended). (Recommended) as is:
  # -p prints and exits; stream-json + --verbose streams events live and ends with one `result` event;
  # dontAsk denies any tool not in allowed_tools instead of waiting for a prompt nobody will answer.
  headless_cmd: ["claude", "-p", "--output-format", "stream-json", "--verbose", "--permission-mode", "dontAsk"]
  allowed_tools:                           # passed as --allowedTools. (Recommended) this list: what score-job and
    - Read                                 # prepare-job use. A tool a skill needs but is not here ends the run
    - Write                                # with stop reason permission_denied (never a hang).
    - Edit
    - Glob
    - Grep
    - Bash(.venv/bin/careeros *)
    - Bash(.venv/bin/python *)
    - Bash(date *)
    - WebSearch                            # score-job: company checks, hiring-freeze signals
    - WebFetch
  model_hint: null                         # null = Claude Code default (Recommended); e.g. sonnet

runs:                                      # reusable default: fine to keep. `careeros run score|prepare`
  preset: medium                           # small | medium (Recommended) | large | max | custom
  presets:                                 # jobs per run and wall-clock minutes; a run stops at whichever comes first
    small:  {max_score_jobs: 10, max_prepare_jobs: 2, max_minutes: 30}
    medium: {max_score_jobs: 25, max_prepare_jobs: 5, max_minutes: 90}      # (Recommended)
    large:  {max_score_jobs: 50, max_prepare_jobs: 10, max_minutes: 180}
    max:    {max_score_jobs: 150, max_prepare_jobs: 25, max_minutes: 480}
  custom: {max_score_jobs: 25, max_prepare_jobs: 5, max_minutes: 90}       # used when preset: custom
  job_timeout_minutes: {score: 10, prepare: 45, inbox_sync: 20}   # (Recommended) one skill call is killed after this
  stop_on_timeout: true                    # true (Recommended): a hung call usually means a prompt or auth wait
  max_consecutive_failures: 3              # 3 (Recommended): stop after this many failed jobs in a row
  preflight_doctor: true                   # true (Recommended): never run on example data or a broken setup
  ranking:                                 # which jobs go first (no LLM). `careeros run score --dry-run` shows why
    freshness_weight: 60                   # 60 (Recommended): freshness dominates
    fresh_hours: 48                        # 48 (Recommended): postings younger than this get the full weight
    stale_days: 30                         # freshness falls linearly to 0 at this age
    dream_bonus: 25                        # dream_list / auto_dream companies
    deadline_bonus: 15                     # the posting closes within deadline_days
    deadline_days: 7
    fit_weight: 0.5                        # prepare runs only: points per fit point
    retry_bonus: 30                        # a job whose last attempt failed goes near the front of the next run
  required_mcp_servers: []                 # MCP servers a run needs logged in (e.g. [gmail] for inbox work);
                                           # one reported needs-auth stops the run with auth_required
  job_lock_minutes: 120                     # 120 (Recommended): a `careeros job lock` taken by a skill expires after this
  retry:
    max_attempts: 2                        # 2 (Recommended): a failed job is retried once in a later run...
    action_item: true                      # ...then becomes an Action Item (true, Recommended); it is never skipped
  prepare:
    stop_at_daily_cap: true                # true (Recommended): stop preparing once the queued (ready to submit)
                                           # jobs fill today's apply cap (targets.yaml volume)
  auto_submit:                             # config only for now: runs NEVER apply in this version
    enabled: false                         # false (Recommended)
    allow: [tier_c, tier_b]                # rules: tier_a|tier_b|tier_c, fit_gte_<n>, fit_lt_<n>, dream, category_<name>
    manual: [tier_a, fit_gte_85]           # (Recommended) always manual; wins over allow. Tier A is manual regardless.
                                           # fit_gte_<n> threshold is yours: 85 (Recommended) = your best matches stay manual

retention:                                 # reusable default: fine to keep. `careeros prune` (dry run unless --yes)
  screenshots_after_closed_days: 30        # rejected/withdrawn/ghosted jobs lose apply step screenshots after this
  keep_confirmation_screenshot: true       # ...but keep NN_confirmation.png as proof you applied
  unprepared_posting_days: 90              # found/scored/skipped postings: description trimmed to a short stub
  run_logs_days: 30                        # 30 (Recommended): data/runs/<id>/run.log + raw stream output go after this
  run_summaries_days: 365                  # 365 (Recommended): the whole run (run.json, attempts) goes after this
                                           # 0 turns a rule off. Never touched: active jobs, submitted/ copies,
                                           # seen.json, posting_history.json, the scam registries.

storage:                                   # reusable default: fine to keep. `careeros storage`, `careeros advise`
  budget_mb: 1024                          # 1024 (Recommended): how much data/ may grow before advise warns
  warn_at_pct: 80                          # 80 (Recommended): warn when now or 90 days out passes this % of the budget
  disk_free_warn_pct: 10                   # 10 (Recommended): warn when the disk has less free space than this

advisor:                                   # suggest-only: `careeros advise` never changes config;
                                           # `careeros advise apply <id>` changes one key, only when you run it
  advise_after_days: 14                    # 14 (Recommended): storage advice once snapshots span this many days
  prune_idle_weeks: 4                      # 4 (Recommended): prune removed nothing this long -> suggest keeping more
  min_runs: 5                              # 5 (Recommended): run advice once a kind has this many runs...
  window_days: 30                          # ...in the last 30 days (Recommended)
  usage_limit_stops: 2                     # 2 (Recommended): this many usage-limit stops -> suggest a smaller preset
  failure_rate_warn: 0.3                   # 0.3 (Recommended): warn when more than 30% of jobs fail

notify:
  on_interview: push                       # push | none  (PushNotification tool from inbox-sync)
  on_offer: push
  on_qa_fail: action_item_only
  daily_digest: true

outreach:                                  # reusable default: fine to keep
  manual_if_connected: true                # already connected on LinkedIn (1st degree): never automate; you tailor it
  manual_if_mutuals: true                  # any mutual connections: same. Record with `careeros outreach mark`

resume_build:
  engine: tectonic                         # tectonic | pdflatex
  fallback: markdown_to_pdf
