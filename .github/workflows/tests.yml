name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    # Which jobs this change needs. Jobs are skipped with `if` (not trigger-level `paths:`), so the required
    # `pytest` check still reports: a skipped job counts as passed.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            python:
              - '**'
              - '!**/*.md'
              - '!docs/**'
            ui:
              - '{ui/**,src/careeros/ui/static/**,.nvmrc,.github/workflows/tests.yml}'

  pytest:
    # CI runs only in the public template: private copies have a small Actions quota, so their syncs are
    # verified locally (`careeros sync pull`). Skipped jobs count as passed there. Docs-only changes skip it.
    needs: changes
    if: ${{ !github.event.repository.private && needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip until the Python package exists
        id: has_pkg
        run: echo "present=$([ -f pyproject.toml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.has_pkg.outputs.present == 'yes'
        run: pip install -e ".[test,ui]"
      - name: Everything + coverage
        if: steps.has_pkg.outputs.present == 'yes'
        run: pytest -q -n auto --cov=careeros --cov-report=term-missing

  ui:
    # CI runs only in the public template: private copies have a small Actions quota, so their syncs are
    # verified locally (`careeros sync pull`). Skipped jobs count as passed there. Runs only when ui/, the
    # committed bundle, .nvmrc or this workflow change; API changes reach it via ui/openapi.json (pytest checks it).
    needs: changes
    if: ${{ !github.event.repository.private && needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          if ! git diff --exit-code -- src/api/schema.gen.ts; then
            echo "::error::ui/src/api/schema.gen.ts differs from 'npm run gen:api'. Regenerate it from ui/openapi.json and commit the result."
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + component tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Committed bundle is up to date
        working-directory: .
        run: |
          git add -N src/careeros/ui/static
          git diff --exit-code --stat src/careeros/ui/static || {
            echo "::error::src/careeros/ui/static differs from a fresh build. Run 'npm run build' in ui/ (Node from .nvmrc) and commit the result."
            exit 1
          }
