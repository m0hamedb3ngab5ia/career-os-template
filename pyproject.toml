[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.1.0"
description = "Job-search automation core"
requires-python = ">=3.11"
dependencies = ["pyyaml", "requests", "pydantic>=2,<3", "openpyxl", "ruamel.yaml>=0.18",
                # typing_extensions.TypedDict: pydantic rejects typing.TypedDict on Python < 3.12
                "typing_extensions>=4.7"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist", "jinja2", "pypdf"]
test = ["pytest", "pytest-cov", "pytest-xdist", "jinja2", "pypdf", "httpx"]
# fastapi pinned to one minor: ui/openapi.json is compared byte-for-byte, so a bump means regenerating it
fast-apply = ["playwright>=1.49"]  # `careeros apply fill`; then `playwright install chromium`
ui = ["fastapi>=0.141,<0.142", "uvicorn", "watchfiles", "anyio>=4.1", "playwright>=1.49"]  # anyio 4.1+: abandon_on_cancel; playwright: Fill application (then `playwright install chromium`)

[project.scripts]
careeros = "careeros.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The built web UI (ui/ -> npm run build); committed so `careeros ui` needs no Node.
careeros = ["ui/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "unit: pure functions/classes; fakes for IO; no subprocess, no network",
    "integration: crosses a boundary (CLI subprocess, filesystem layout, workbook, recorded HTTP, PDF render, real YAML)",
    "live: calls the real `claude` CLI; skipped unless CAREEROS_LIVE_SMOKE=1",
]
